<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>天気と1日の気温｜4年理科</title>
<style>
  :root{
    --ai:#1f6a5a; --ai2:#144a3f; --syu:#d6392c; --kin:#e0a52c; --sumi:#2b2b2b;
    --paper:#fff; --line:#c3d9d2;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{font-size:clamp(11px,1.06vh + 0.4vw,19px);}
  body{
    height:100dvh; overflow:hidden;
    background:linear-gradient(170deg,#eef7f3,#d7e9e2);
    color:var(--sumi);
    font-family:"UD デジタル教科書体 NK-R","UD Digi Kyokasho NK-R","Hiragino Maru Gothic ProN",
                "ヒラギノ丸ゴ ProN","Zen Maru Gothic","Yu Gothic Medium","游ゴシック Medium","Meiryo",sans-serif;
    -webkit-text-size-adjust:100%;
    display:flex; flex-direction:column;
  }
  ruby rt{font-size:.46em; font-weight:400;}
  button{font:inherit; cursor:pointer;}

  /* ── ヘッダー ── */
  .bar1{
    flex:0 0 auto; background:var(--ai); color:#fff;
    padding:.4rem 1rem; display:flex; align-items:center; gap:.7rem;
  }
  .grade{font-size:.85rem; background:var(--ai2); border-radius:999px; padding:.12rem .8rem; white-space:nowrap;}
  .bar1 h1{font-size:1.2rem; font-weight:700; line-height:1.2;}
  .bar2{
    flex:0 0 auto; background:var(--paper); border-bottom:.2rem solid var(--kin);
    padding:.45rem 1rem; display:flex; align-items:center; gap:.9rem; flex-wrap:wrap;
  }
  .ask{font-size:1.02rem; font-weight:700; color:var(--ai); line-height:1.3;}
  .tabs{display:flex; gap:.4rem; margin-left:auto; flex-wrap:wrap; justify-content:flex-end;}
  .tab{
    background:#f2f7fa; border:.14rem solid var(--line); border-radius:999px;
    padding:.28rem .95rem; color:#4a6b7d; font-weight:700; font-size:.98rem;
    display:flex; align-items:center; gap:.4rem; transition:.15s;
  }
  .tab .no{
    width:1.35rem; height:1.35rem; border-radius:50%; background:#b6c8d2; color:#fff;
    font-size:.85rem; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .tab.on{background:var(--paper); border-color:var(--ai); color:var(--ai);}
  .tab.on .no{background:var(--ai);}
  .tab:hover,.tab:focus-visible{border-color:var(--kin); outline:none;}
  .toggle{display:flex; background:#e6eef3; border-radius:999px; padding:.18rem; gap:.15rem;}
  .tg{
    border:none; background:transparent; color:#5c7b8d; font-weight:700; font-size:.98rem;
    padding:.28rem 1.05rem; border-radius:999px; transition:.15s;
  }
  .tg.on{background:var(--ai); color:#fff;}
  .tg:focus-visible{outline:.16rem solid var(--kin);}

  /* ── レイアウト ── */
  main{
    flex:1 1 auto; min-height:0;
    display:grid; grid-template-columns:1.12fr 1fr; gap:.7rem;
    padding:.65rem .9rem .8rem;
  }
  .board{
    background:var(--paper); border-radius:.9rem; padding:.55rem;
    box-shadow:0 .15rem .5rem rgba(31,106,90,.14);
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:.55rem;
    min-height:0;
  }
  .board.n5{grid-template-columns:repeat(6,1fr);}
  .board.n5 .card{grid-column:span 2;}
  .board.n5 .card:nth-child(4){grid-column:2/span 2;}
  .board.n5 .card:nth-child(5){grid-column:4/span 2;}
  .board.n6{grid-template-columns:repeat(3,1fr);}
  .card{
    position:relative; min-height:0; min-width:0; text-align:left; padding:0;
    border:.16rem solid var(--line); border-radius:.6rem; overflow:hidden;
    background:#f4f8fa; display:flex; flex-direction:column; transition:.18s;
  }
  .card img{flex:1 1 auto; width:100%; min-height:0; object-fit:cover; display:block;}
  .card img.contain{object-fit:contain; background:#f7f3ea; padding:.2rem;}
  .card .cap{
    flex:0 0 auto; text-align:center; font-size:1.22rem; font-weight:700;
    background:rgba(255,255,255,.96); padding:.24rem .3rem .3rem; line-height:1.2;
    letter-spacing:.02em;
  }
  /* 文章の資料カード */
  .card.doc{padding:2rem .7rem .6rem; display:block; overflow:hidden;}
  .card.doc .dh{display:block; font-size:1.02rem; font-weight:700; line-height:1.35; margin-bottom:.35rem;}
  .card.doc .dt{display:block; font-size:.92rem; line-height:1.75;}
  .card.doc.pink{background:#fbe8ef; border-color:#e9b7cb;}
  .card.doc.pink .dh{color:#a83a63;}
  .card.doc.blue{background:#e6f0f8; border-color:#a9c7dd;}
  .card.doc.blue .dh{color:#1b4a68;}
  .card.doc.green{background:#e4f3ec; border-color:#9fcdb8;}
  .card.doc.green .dh{color:#1f6a5a;}
  .card.doc.yellow{background:#fdf3cf; border-color:#e0c469;}
  .card.doc.yellow .dh{color:#8a6a12;}

  .badge{
    position:absolute; top:.3rem; left:.3rem; z-index:2;
    width:1.8rem; height:1.8rem; border-radius:50%;
    background:var(--paper); border:.16rem solid var(--ai); color:var(--ai);
    font-size:.95rem; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .card:hover,.card:focus-visible{border-color:var(--kin); transform:translateY(-.15rem); outline:none;}
  .card[aria-pressed="true"]{border-color:var(--ai); border-width:.26rem;}
  .card.right{border-color:var(--syu); border-width:.26rem;}
  .card.right .badge{border-color:var(--syu); color:var(--syu);}
  .card.ng{border-color:#b9b9b9; filter:grayscale(.85); opacity:.5; animation:shake .38s;}
  .board.locked .card{cursor:default;}
  .board.locked .card:hover{transform:none; border-color:var(--line);}
  .card .stamp{
    position:absolute; inset:0; margin:auto; width:54%; z-index:3;
    background:var(--hanamaru) center/contain no-repeat; opacity:0; pointer-events:none;
  }
  .card.right .stamp{animation:stamp .45s cubic-bezier(.2,1.5,.4,1) forwards;}


  /* ── 大きく見る（上）＋ならべる（下）── */
  .boardwrap{display:flex; flex-direction:column; gap:.55rem; min-height:0; min-width:0;}
  .bigview{
    flex:1 1 auto; min-height:0; position:relative; display:flex; flex-direction:column;
    background:var(--paper); border-radius:.9rem; padding:.55rem;
    box-shadow:0 .15rem .5rem rgba(31,106,90,.14);
  }
  .bigview img{flex:1 1 auto; min-height:0; width:100%; object-fit:contain; display:block;
    border-radius:.5rem; background:#f4f8fa; cursor:zoom-in;}
  .bigview .bcap{flex:0 0 auto; margin:0; text-align:center; font-size:1.35rem; font-weight:700; padding:.3rem 0 .05rem; line-height:1.3;}
  .bigview .bdoc{flex:1 1 auto; min-height:0; overflow:auto; display:flex; flex-direction:column; justify-content:center;
    gap:.6rem; padding:1rem 2.2rem; border-radius:.5rem; border:.16rem solid var(--line);}
  .bigview .bdoc .dh{font-size:1.5rem; font-weight:700;}
  .bigview .bdoc .dt{font-size:1.3rem; line-height:2;}
  .bigview .bdoc.yellow{background:#fdf3cf; border-color:#e0c469;} .bigview .bdoc.yellow .dh{color:#8a6a12;}
  .bigview .bdoc.blue{background:#e6f0f8; border-color:#a9c7dd;}   .bigview .bdoc.blue .dh{color:#1b4a68;}
  .bigview .bdoc.green{background:#e4f3ec; border-color:#9fcdb8;}  .bigview .bdoc.green .dh{color:#1f6a5a;}
  .bigview .bdoc.pink{background:#fbe8ef; border-color:#e9b7cb;}   .bigview .bdoc.pink .dh{color:#a83a63;}
  .bigview .badge{top:.9rem; left:.9rem; width:2.3rem; height:2.3rem; font-size:1.2rem;}
  .bigview .stamp{position:absolute; inset:0; margin:auto; width:min(40%,45vh); height:min(40%,45vh); z-index:3;
    background:var(--hanamaru) center/contain no-repeat; opacity:0; pointer-events:none;}
  .bigview.right .stamp{animation:stamp .45s cubic-bezier(.2,1.5,.4,1) forwards;}
  .bigview.right{box-shadow:0 0 0 .26rem var(--syu);}
  .board{flex:0 0 27%; grid-template-columns:repeat(var(--n,3),1fr) !important; grid-template-rows:1fr !important;}
  .board .card{grid-column:auto !important;}
  .board .card .cap{font-size:.95rem; padding:.18rem .2rem .22rem;}
  .board .card.doc{padding:2.2rem .5rem .4rem;}
  .board .card.doc .dt{display:none;}
  .board .card .badge{width:1.5rem; height:1.5rem; font-size:.8rem;}
  .card.cur{border-color:var(--ai); border-width:.26rem;}
  .card.cur:not(.right)::after{content:''; position:absolute; inset:0; background:rgba(255,255,255,0); pointer-events:none;}

  /* ── 右パネル ── */
  .panel{
    background:var(--paper); border-radius:.9rem;
    box-shadow:0 .15rem .5rem rgba(31,106,90,.14);
    padding:.8rem 1rem .9rem; display:flex; flex-direction:column; min-height:0;
  }
  .view{display:none; flex:1 1 auto; flex-direction:column; min-height:0;}
  .view.on{display:flex;}
  .hint{
    flex:0 0 auto; margin:auto 0; display:block; width:100%;
    text-align:center; font-size:1.15rem; line-height:2.3; color:#5c7b8d;
  }
  .ex{flex:1 1 auto; min-height:0; display:none; flex-direction:column;}
  .ex.on{display:flex;}
  .ex h2{
    flex:0 0 auto; display:flex; align-items:center; gap:.5rem; flex-wrap:wrap;
    font-size:1.7rem; color:var(--ai); line-height:1.3;
    border-bottom:.16rem solid var(--kin); padding-bottom:.4rem; margin-bottom:.6rem;
  }
  .ex h2 .mark{
    width:1.95rem; height:1.95rem; border-radius:50%; background:var(--ai); color:#fff;
    font-size:1.05rem; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .place{font-size:.85rem; font-weight:400; color:#fff; background:#6f93a8; border-radius:999px; padding:.1rem .7rem; margin-left:auto;}
  .ex .body{flex:1 1 auto; min-height:0; overflow-y:auto; font-size:1.5rem; line-height:2.1;}
  .ex .body p + p{margin-top:.9rem;}
  .ex .body em{font-style:normal; color:var(--syu); font-weight:700;}

  /* ── しりょうタブ（うごく絵） ── */
  main.solo{grid-template-columns:1fr;}
  main.solo .boardwrap{display:none;}
  .stage{
    flex:1 1 auto; min-height:0; position:relative; overflow:hidden;
    border:.16rem solid var(--line); border-radius:.7rem; background:#fbfcfd;
  }
  .stage img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    opacity:0; transition:opacity .9s ease;
  }
  .stage img.on{opacity:1; animation:kb 7s linear forwards;}
  @keyframes kb{from{transform:scale(1);}to{transform:scale(1.03);}}
  .mcap{
    flex:0 0 auto; margin-top:.6rem; font-size:1.14rem; line-height:1.85;
    color:var(--ai); font-weight:700;
  }
  .mcap.in{animation:capin .7s ease-out;}
  @keyframes capin{from{opacity:0; transform:translateY(.4rem);}to{opacity:1; transform:none;}}
  .mctl{flex:0 0 auto; display:flex; align-items:center; gap:.45rem; margin-top:.6rem;}
  .mbtn{
    background:#f2f7fa; border:.14rem solid var(--line); border-radius:999px;
    padding:.24rem .95rem; color:#4a6b7d; font-weight:700; font-size:.95rem;
  }
  .mbtn.main{background:var(--ai); border-color:var(--ai); color:#fff; min-width:7.5rem;}
  .mbtn:disabled{opacity:.35;}
  .mdots{display:flex; gap:.3rem; margin-left:.5rem;}
  .mdot{width:.62rem; height:.62rem; border-radius:50%; background:#d5e2ea;}
  .mdot.on{background:var(--kin);}
  .mstep{margin-left:auto; font-size:.9rem; color:#5c7b8d; font-weight:700;}

  /* ── うごく絵（SVGアニメーション） ── */
  .mv{width:100%; height:100%; display:block;}
  .mv text{font-family:inherit; font-weight:700; fill:#2b2b2b;
           paint-order:stroke; stroke:#fff; stroke-width:7; stroke-linejoin:round;}
  .mv .lb{font-size:28px;}
  .mv .rb{font-size:15px; stroke-width:5;}
  .mv .fx{opacity:0;}
  .mv-drop{transform-box:fill-box; transform-origin:center;}
  .mv.paused *{animation-play-state:paused !important;}

  @keyframes mvFlow{to{stroke-dashoffset:-40;}}
  @keyframes mvRise{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  @keyframes mvSpread{from{transform:scale(.02);}to{transform:scale(1);}}
  @keyframes mvPop{from{opacity:0; transform:translateY(12px);}to{opacity:1; transform:none;}}
  @keyframes mvGo{to{opacity:0;}}
  @keyframes mvVeil{to{opacity:.92;}}
  @keyframes mvShow{to{opacity:.9;}}
  @keyframes mvDark{to{opacity:.24;}}
  @keyframes mvHalf{to{opacity:.3;}}
  @keyframes mvGlow{0%{opacity:.25;}100%{opacity:.95;}}
  @keyframes mvCloud{from{opacity:0; transform:scale(.22);}to{opacity:.8; transform:scale(1);}}
  @keyframes mvPuff{0%{opacity:0; transform:translate(0,0) scale(.35);}
                    25%{opacity:.8;}
                    100%{opacity:0; transform:translate(-30px,-132px) scale(1.8);}}
  @keyframes mvFall{0%{opacity:0; transform:translate(0,0);}
                    15%{opacity:.85;} 100%{opacity:0; transform:translate(18px,250px);}}
  @keyframes mvDraw{to{stroke-dashoffset:0;}}
  @keyframes mvStone{from{opacity:0; transform:scale(.2);}to{opacity:1; transform:scale(1);}}
  @keyframes mvDrop{0%{opacity:0; transform:translate(0,0) scale(1);}
                    12%{opacity:.95;}
                    28%{transform:translate(-7px,38px) scale(1);}
                    50%{transform:translate(6px,72px) scale(.95);}
                    72%{transform:translate(-5px,104px) scale(.9);}
                    88%{opacity:.8;}
                    100%{opacity:0; transform:translate(3px,146px) scale(.75);}}

  /* ── うごく絵ごとの指定（ms- ma- …）は ここに足す ── */
  /* れい（ms-）：太陽が出る → つぶが上へ → 文字が出る */
  .mv.run .ms-sun{animation:mvPop .8s ease-out forwards; animation-delay:calc(var(--t) + 3.2s);}
  .ms-p{transform-box:fill-box; transform-origin:center;}
  .mv.run .ms-p{animation:mvPuff 2.4s ease-out infinite;}
  .mv.run .ms-lab{animation:mvPop .8s ease-out forwards; animation-delay:calc(var(--t) + 7.8s);}

  /* mk-：資料タブ「気温が いちばん高くなるのは 午後2時ごろ」（太陽 → 地面 → 空気） */
  .mk-arm{transform-box:view-box; transform-origin:450px 420px; transform:rotate(-60deg);}
  .mv.run .mk-arm{animation:mkS1 2.5s ease-in-out forwards, mkS2 1.5s ease-in-out forwards, mkS3 1.5s ease-in-out forwards;
    animation-delay:calc(var(--t) + 4.3s), calc(var(--t) + 10.3s), calc(var(--t) + 16.3s);}
  @keyframes mkS1{from{transform:rotate(-60deg);}to{transform:rotate(0deg);}}
  @keyframes mkS2{from{transform:rotate(0deg);}to{transform:rotate(15deg);}}
  @keyframes mkS3{from{transform:rotate(15deg);}to{transform:rotate(30deg);}}
  @keyframes mkIn{from{opacity:0;}to{opacity:1;}}
  @keyframes mkOut{from{opacity:1;}to{opacity:0;}}
  .mv.run .mk-c0{animation:mkOut .3s forwards; animation-delay:calc(var(--t) + 4s);}
  .mv.run .mk-c1{animation:mkIn .3s forwards, mkOut .3s forwards; animation-delay:calc(var(--t) + 4s), calc(var(--t) + 10s);}
  .mv.run .mk-c2{animation:mkIn .3s forwards, mkOut .3s forwards; animation-delay:calc(var(--t) + 10s), calc(var(--t) + 16s);}
  .mv.run .mk-c3{animation:mkIn .3s forwards; animation-delay:calc(var(--t) + 16s);}
  .mk-hot{opacity:0;}
  .mv.run .mk-hot{animation:mkH1 2s forwards, mkH2 2.5s forwards; animation-delay:calc(var(--t) + 6s), calc(var(--t) + 10.5s);}
  @keyframes mkH1{from{opacity:0;}to{opacity:.3;}}
  @keyframes mkH2{from{opacity:.3;}to{opacity:.85;}}
  .mk-gt,.mk-at{transform-box:fill-box; transform-origin:50% 100%; transform:scaleY(.2);}
  .mv.run .mk-gt{animation:mkG1 2s forwards, mkG2 2.5s forwards; animation-delay:calc(var(--t) + 6s), calc(var(--t) + 10.5s);}
  @keyframes mkG1{from{transform:scaleY(.2);}to{transform:scaleY(.5);}}
  @keyframes mkG2{from{transform:scaleY(.5);}to{transform:scaleY(.95);}}
  .mv.run .mk-at{animation:mkA1 2.5s forwards, mkA2 3s forwards; animation-delay:calc(var(--t) + 11s), calc(var(--t) + 16.8s);}
  @keyframes mkA1{from{transform:scaleY(.2);}to{transform:scaleY(.4);}}
  @keyframes mkA2{from{transform:scaleY(.4);}to{transform:scaleY(.95);}}
  .mk-air{opacity:0;}
  .mv.run .mk-air{animation:mkAir 3s forwards; animation-delay:calc(var(--t) + 16.8s);}
  @keyframes mkAir{from{opacity:0;}to{opacity:.65;}}
  .mk-w{transform-box:fill-box; transform-origin:center;}
  .mv.run .mk-w{animation:mkWave 2.4s ease-out infinite; animation-delay:calc(var(--t) + 16.5s + var(--d));}
  @keyframes mkWave{0%{opacity:0; transform:translateY(0);} 30%{opacity:.95;} 100%{opacity:0; transform:translateY(-150px);}}
  .mv.run .mk-l1{animation:mvPop .8s ease-out forwards; animation-delay:calc(var(--t) + 6.8s);}
  .mv.run .mk-l2{animation:mvPop .8s ease-out forwards; animation-delay:calc(var(--t) + 12.8s);}
  .mv.run .mk-l3{animation:mvPop .8s ease-out forwards; animation-delay:calc(var(--t) + 19.5s);}
  .mv.run .mk-sum{animation:mvPop .8s ease-out forwards; animation-delay:calc(var(--t) + 23.5s);}

  /* ── しりょうタブ（media を持つタブ）だけ 色を変えて目立たせる ── */
  .tab.shiryo{background:#fdf2dc; border-color:#e0a52c; color:#8a5a12;}
  .tab.shiryo .no{background:#e0a52c;}
  .tab.shiryo:hover,.tab.shiryo:focus-visible{border-color:#b8790c;}
  .tab.shiryo.on{background:var(--paper); border-color:#b8790c; color:#8a5a12;
                 box-shadow:0 0 0 .14rem rgba(224,165,44,.4);}
  .tab.shiryo.on .no{background:#b8790c;}

  /* サブタブが3つ以上でもはみ出さないように */
  .subtabs{flex-wrap:wrap;}
  .st{flex:0 0 auto; white-space:nowrap;}

  /* もんだい */
  .subtabs{flex:0 0 auto; display:flex; gap:.4rem; margin-bottom:.5rem;}
  .st{
    background:#f2f7fa; border:.14rem solid var(--line); border-radius:999px;
    padding:.2rem .85rem; color:#4a6b7d; font-weight:700; font-size:.92rem;
  }
  .st.on{background:var(--ai); border-color:var(--ai); color:#fff;}
  .qhead{
    flex:0 0 auto; display:flex; align-items:baseline; gap:.5rem;
    color:var(--ai); font-weight:700; font-size:.98rem;
    border-bottom:.14rem dotted var(--line); padding-bottom:.35rem;
  }
  .qhead b{font-size:1.55rem; color:var(--syu); line-height:1;}
  .qhead .sub{margin-left:auto; font-size:.88rem; font-weight:400; color:#5c7b8d;}
  .qhead .dots{display:flex; gap:.3rem; margin-left:.6rem;}
  .hintbtn{
    align-self:center; margin-left:.5rem; flex:0 0 auto;
    background:#fdf6e0; border:.15rem solid var(--kin); border-radius:999px;
    color:#a97a12; font-weight:700; font-size:.92rem; padding:.2rem .75rem;
    transition:transform .12s, background .15s;
  }
  .hintbtn:hover:not(:disabled){background:var(--kin); color:#fff;}
  .hintbtn:active:not(:disabled){transform:scale(.94);}
  .hintbtn.on{background:var(--kin); color:#fff;}
  .hintbtn:disabled{opacity:.35;}
  .qhint{
    flex:0 0 auto; margin:.55rem 0 0; min-height:5.1rem; box-sizing:border-box;
    background:#fdf6e0; border-left:.4rem solid var(--kin); border-radius:.4rem;
    padding:.5rem .8rem; font-size:1.18rem; line-height:1.75; color:#6a5320;
    opacity:0; transition:opacity .2s;
  }
  .qhint.on{opacity:1;}
  .qhint b{color:#a97a12; margin-right:.4rem;}
  .dot{
    width:1rem; height:1rem; border-radius:50%; border:.13rem solid #a9c2ce;
    background-size:contain; background-repeat:no-repeat; background-position:center; transition:transform .25s;
  }
  .dot.on{border-color:transparent; background-image:var(--hanamaru); transform:scale(1.3);}
  .saybox{
    flex:1 1 auto; min-height:0; overflow-y:auto; margin:.45rem 0 .55rem;
    display:grid; align-content:center;
    background:#fdf6e0; border:.16rem solid var(--kin); border-radius:.7rem; padding:.9rem 1.2rem;
  }
  .say{display:block; font-size:1.35rem; line-height:2.25; font-weight:500; text-indent:1em; overflow-wrap:anywhere;}
  .blank{display:inline-block; min-width:6rem; text-align:center; border-bottom:.18rem solid var(--ai); color:var(--syu); font-weight:700;}
  .blank.now{background:#fff3d4; border-bottom-color:var(--kin); border-radius:.3rem .3rem 0 0;}   /* いま えらんでいる 空らん */
  [data-q="multi"] .saybox{flex:0 0 auto; padding:.55rem 1.2rem;}
  [data-q="multi"] .say{font-size:1.22rem; line-height:1.9; text-indent:0; text-align:center;}
  [data-q="multi"] .choices{flex:1 1 auto; min-height:0; overflow-y:auto;
                            align-content:stretch; grid-auto-rows:minmax(min-content,1fr); gap:.55rem;}

  [data-q="pick"] .choices{grid-template-columns:repeat(auto-fit,minmax(2.6rem,1fr)); gap:.6rem;}
  [data-q="pick"] .opt{font-size:1.9rem; padding:.3rem .2rem; line-height:1.25;}
  .choices{flex:0 0 auto; display:grid; gap:.45rem; grid-template-columns:repeat(2,1fr);}
  [data-q="multi"] .choices{grid-template-columns:1fr;}
  .opt{
    background:#f2f7fa; border:.18rem solid var(--ai); border-radius:.55rem; color:var(--ai);
    font-weight:700; font-size:1.22rem; padding:.45rem .3rem; transition:transform .12s, background .15s;
  }
  [data-q="multi"] .opt{
    font-size:1.34rem; font-weight:500; line-height:1.75; text-align:left;
    padding:.55rem 1rem; display:flex; gap:.6rem; align-items:center;
  }
  .opt .mk{flex:0 0 auto; font-weight:700; font-size:1.15rem; color:var(--ai); min-width:1.6rem;}
  [data-q="multi"] .opt .mk{font-size:1.45rem; min-width:2.1rem;}
  .opt:hover:not(:disabled),.opt:focus-visible{background:#fff3d4; transform:translateY(-.1rem); outline:none;}
  .opt:disabled{cursor:default; opacity:.45;}
  .opt.ng{animation:shake .38s; background:#f0f0f0; border-color:#b9b9b9; color:#9a9a9a; opacity:1;}
  .opt.ok{background:#fff; border-color:var(--syu); color:var(--syu); opacity:1;}
  .opt.ok .mk{color:var(--syu);}
  .msg{flex:0 0 auto; min-height:1.6rem; text-align:center; font-size:1rem; font-weight:700; color:var(--syu); padding-top:.25rem;}

  .result{flex:1 1 auto; display:none; flex-direction:column; align-items:center; justify-content:center; gap:.7rem; text-align:center;}
  .result.on{display:flex;}
  .result img{width:min(34vh,17rem); animation:stamp .5s cubic-bezier(.2,1.5,.4,1) both;}
  .result .score{font-size:1.3rem; font-weight:700; color:var(--ai);}
  .result .score em{font-style:normal; font-size:2.3rem; color:var(--syu); margin:0 .15rem;}
  .btns{display:flex; gap:.7rem; flex-wrap:wrap; justify-content:center;}
  .again{font-size:1.05rem; font-weight:700; background:var(--ai); color:#fff; border:none; border-radius:999px; padding:.5rem 1.7rem;}
  .again:hover,.again:focus-visible{background:var(--syu); outline:none;}
  .again.miss{background:var(--kin); color:#5a4208;}
  .again.miss:hover,.again.miss:focus-visible{background:var(--syu); color:#fff;}

  /* ── 拡大表示 ── */
  #zoom{
    position:fixed; inset:0; z-index:60; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:.7rem;
    background:rgba(20,74,63,.88); padding:2.2vh 2vw; cursor:zoom-out;
  }
  #zoom.on{display:flex; animation:zoomin .22s ease-out;}
  #zoom img{
    max-width:94vw; max-height:84vh; object-fit:contain;
    background:#fff; border:.3rem solid #fff; border-radius:.6rem;
    box-shadow:0 .8rem 2rem rgba(0,0,0,.4);
  }
  #zoom .zcap{color:#fff; font-size:1.15rem; font-weight:700; text-align:center; line-height:1.4;}
  #zoom .zhint{color:#cfe2ec; font-size:.9rem;}
  @keyframes zoomin{from{opacity:0;transform:scale(.94);} to{opacity:1;transform:scale(1);}}

  #big{
    position:fixed; inset:0; margin:auto; width:min(34vh,34vw); height:min(34vh,34vw);
    background:var(--hanamaru) center/contain no-repeat; opacity:0; pointer-events:none; z-index:50;
  }
  #big.go{animation:big 1.1s ease-out forwards;}

  @keyframes stamp{from{opacity:0;transform:scale(.35) rotate(-28deg);} to{opacity:.92;transform:scale(1) rotate(-6deg);}}
  @keyframes big{0%{opacity:0;transform:scale(.3) rotate(-30deg);}28%{opacity:.95;transform:scale(1.06) rotate(4deg);}45%{opacity:.95;transform:scale(1) rotate(0);}100%{opacity:0;transform:scale(1.12);}}
  @keyframes shake{25%{transform:translateX(-.35rem);}50%{transform:translateX(.35rem);}75%{transform:translateX(-.2rem);}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;}}

  @media (max-aspect-ratio:1/1){
    main{grid-template-columns:1fr; grid-template-rows:1.05fr 1fr;}
    .ask{display:none;}
    .tabs{margin-left:0;}
  }
  /* グラフに点をうつ問題（mode:'plot'） */
  .plotsvg{flex:1 1 auto; min-height:0; width:100%; display:block; touch-action:none; cursor:crosshair;
           background:#fff; border-radius:.5rem; user-select:none; -webkit-user-select:none;}
  .plotsvg .pl-pop{transform-box:fill-box; transform-origin:center; animation:plPop .3s cubic-bezier(.2,1.6,.4,1);}
  .plotsvg .pl-x{animation:plX .9s ease-out forwards;}
  @keyframes plPop{from{transform:scale(.2); opacity:0;}to{transform:scale(1); opacity:1;}}
  @keyframes plX{0%{opacity:1;}70%{opacity:1;}100%{opacity:0;}}
  [data-q="plot"] .saybox{flex:0 0 auto; padding:.55rem 1.2rem;}
  [data-q="plot"] .say{font-size:1.22rem; line-height:1.9; text-indent:0; text-align:center;}
  [data-q="plot"] .choices{flex:1 1 auto; grid-template-columns:repeat(3,1fr); align-content:center; gap:.55rem;}
  .pchip{display:flex; flex-direction:column; align-items:center; gap:.1rem; padding:.45rem .2rem;
         border:.16rem dashed var(--line); border-radius:.55rem; background:#f7fafb; color:#5c7b8d; font-weight:700; font-size:1.05rem;}
  .pchip b{font-size:1.3rem; color:#b6c8d2; min-height:1.7rem;}
  .pchip.ok{border-style:solid; border-color:var(--syu); background:#fff; color:var(--syu);}
  .pchip.ok b{color:var(--syu);}
  .pchip.pre{border-style:solid; border-color:#b6c8d2; background:#eef3f6;}
  .pchip.pre b{color:#5c7b8d;}
  .prand{grid-column:1/-1; justify-self:center; background:#fff; border:.15rem solid var(--ai); color:var(--ai);
         border-radius:999px; padding:.3rem 1.2rem; font-weight:700; font-size:1rem; box-shadow:0 2px 0 var(--ai2);}
  .prand:hover{background:var(--ai); color:#fff;}
  /* よう器の名前（あ）（い） */
  .ai{color:#1565c0; font-weight:800; white-space:nowrap; letter-spacing:-.05em;}
</style>
</head>

<div class="bar1">
  <span class="grade" id="grade"></span>
  <h1 id="unitTitle"></h1>
</div>
<div class="bar2">
  <p class="ask" id="ask"></p>
  <div class="tabs" id="tabs"></div>
  <div class="toggle" id="toggle">
    <button class="tg on" data-m="explain">説明</button>
    <button class="tg" data-m="quiz">問題</button>
  </div>
</div>

<main>
  <section class="boardwrap">
    <div class="bigview" id="bigview"></div>
    <section class="board" id="board"></section>
  </section>

  <section class="panel">
    <div class="view on" id="vExplain">
      <p class="hint" id="hint"></p>
      <article class="ex" id="ex">
        <h2><span class="mark" id="exMark"></span><span id="exTitle"></span><span class="place" id="exPlace"></span></h2>
        <div class="body" id="exBody"></div>
      </article>
    </div>

    <div class="view" id="vQuiz">
      <div class="subtabs" id="subtabs"></div>
      <div class="qhead" id="qhead">
        <span>もんだい</span><b id="qnum">1</b><span>／<span id="qall">4</span></span>
        <span class="dots" id="dots"></span>
        <span class="sub" id="qsub"></span>
        <button class="hintbtn" id="hintbtn">ヒント</button>
      </div>
      <p class="qhint" id="qhint"></p>
      <div class="saybox" id="saybox"><p class="say" id="say"></p></div>
      <div class="choices" id="choices"></div>
      <p class="msg" id="msg"></p>
      <div class="result" id="result">
        <img id="resultImg" alt="はなまる">
        <p class="score"></p>
        <div class="btns">
          <button class="again" id="again">もういちど</button>
          <button class="again miss" id="retry" hidden></button>
        </div>
      </div>
    </div>

    <div class="view" id="vMovie">
      <div class="subtabs" id="msubtabs"></div>
      <div class="stage" id="stage"></div>
      <p class="mcap" id="mcap"></p>
      <div class="mctl">
        <button class="mbtn" id="mprev">◀ もどる</button>
        <button class="mbtn main" id="mplay">▶ さいせい</button>
        <button class="mbtn" id="mnext">つぎ ▶</button>
        <span class="mdots" id="mdots"></span>
        <span class="mstep" id="mstep"></span>
      </div>
    </div>
  </section>
</main>

<div id="zoom"><img id="zoomImg" alt=""><p class="zcap" id="zoomCap"></p><p class="zhint">もういちどクリックすると もどります</p></div>

/* ── 書くときの道具 ───────────────────────────────
   R('漢字','よみ')  … ふりがなを付ける。  例 R('実験','じっけん')
   B                 … word問題の空らん（　）。問題文に1つ入れる
   LB('あ')          … よう器・班などの名前を（あ）と青の太字にする。文の中でうもれない
   <em>…</em>        … 説明文の赤い強調。ふりがなは付かないのでやさしい語に
   PH('①','名前')    … 仮の絵（点線のわく）。本物の絵ができるまでの代わり
   ───────────────────────────────────────────── */
const LB=s=>'<b class="ai">（'+s+'）</b>';

/* ══════════ 0. 単元の名前 ══════════ */

/* ══════════ 1. 画像 ══════════
   この単元の絵は、ぜんぶ SVG で かいています（写真なし・ネットなしで動く）。
   ・グラフ … GRAPH({x:時こく, s:[{v:気温の数字}], …})　数字を書きかえれば 点も線も かわる
   ・表     … TABLE({t:時こく, v:気温})
   ・空     … SKY('hare') ／ SKY('kumori')
   ・はかり方の絵 … PAPER()・HYAKU()・TAKASA()
   テストの写真（百葉箱・紙でおおう子ども）を使いたいときは、
   IMG_A1・IMG_A2 の行を JPEG の base64 に 置きかえる（const IMG_A1='data:image/jpeg;base64,…';）。
   ヒント用の絵は、同じ道具に しるし（mark・circle・arrow・span）を 足して作っている。 */
const SVGURL=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const SVGHEAD=(w,h)=>'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" font-family="Hiragino Maru Gothic ProN,Meiryo,sans-serif" font-weight="700">';
const RED='#d6392c', HARE='#e0452b', KUMO='#3d6db5';
/* やじるしの先（赤・青・緑） */
const AH='<defs>'+
 '<marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="'+RED+'"/></marker>'+
 '<marker id="ab" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="'+KUMO+'"/></marker>'+
 '<marker id="ag" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6a5a"/></marker>'+
 '</defs>';
const f1=v=>Math.round(v*10)/10;
const LBL='stroke="#fff" stroke-width="6" paint-order="stroke"';   /* 文字のまわりを白くふちどる */

/* 折れ線グラフ
   x:時こくの名前　x2:その下の名前（午前・午後）　s:[{v:[気温…], c:色}]
   title:題　date:日づけ　pad:右に空ける列の数
   しるし … circle:[[列,気温],…] 赤丸　arrow:[[列,気温,列,気温],…] 赤いやじるし
            span:[[列,下,上,'文字','ah'|'ab','below'],…] 上下のやじるし（below で文字を下に）　band:列 黄色の帯　legend:[['名前',色],…] */
function GRAPH(o){
  const W=760,H=540,L=110,Rr=700,T=80,Bt=450,ymax=30;
  const n=o.x.length+(o.pad||0), st=(Rr-L)/n;
  const X=i=>f1(L+st*(i+.5)), Y=v=>f1(Bt-v/ymax*(Bt-T));
  let s=SVGHEAD(W,H)+AH+'<rect width="'+W+'" height="'+H+'" fill="#fdf1d8"/>'+
        '<rect x="'+L+'" y="'+T+'" width="'+(Rr-L)+'" height="'+(Bt-T)+'" fill="#fff"/>';
  if(o.band!=null) s+='<rect x="'+f1(L+st*o.band)+'" y="'+T+'" width="'+f1(st)+'" height="'+(Bt-T)+'" fill="#ffe7a0"/>';
  for(let v=0;v<=ymax;v++){
    const y=Y(v), big=v%5===0;
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+Rr+'" y2="'+y+'" stroke="'+(big?'#5b9fd2':'#d3e6f4')+'" stroke-width="'+(big?2:1)+'"/>';
    if(big) s+='<text x="'+(L-12)+'" y="'+(y+9)+'" text-anchor="end" font-size="26" fill="#2b2b2b">'+v+'</text>';
  }
  for(let i=0;i<o.x.length;i++){
    const x=X(i);
    s+='<line x1="'+x+'" y1="'+T+'" x2="'+x+'" y2="'+Bt+'" stroke="#5b9fd2" stroke-width="1.5"/>';
    s+='<text x="'+x+'" y="'+(Bt+34)+'" text-anchor="middle" font-size="'+(o.x[i].length>2?20:24)+'" fill="#2b2b2b">'+o.x[i]+'</text>';
    if(o.x2&&o.x2[i]) s+='<text x="'+x+'" y="'+(Bt+64)+'" text-anchor="middle" font-size="20" fill="#2b2b2b">'+o.x2[i]+'</text>';
  }
  s+='<rect x="'+L+'" y="'+T+'" width="'+(Rr-L)+'" height="'+(Bt-T)+'" fill="none" stroke="#5b9fd2" stroke-width="2"/>';
  s+='<text x="'+(L-62)+'" y="'+(T-22)+'" font-size="22">(℃)</text>';
  s+='<text x="34" y="'+((T+Bt)/2-6)+'" font-size="24" text-anchor="middle">気</text>'+
     '<text x="34" y="'+((T+Bt)/2+24)+'" font-size="24" text-anchor="middle">温</text>';
  s+='<text x="'+(Rr+30)+'" y="'+(Bt+34)+'" font-size="20" text-anchor="middle">(時)</text>';
  s+='<text x="'+((L+Rr)/2)+'" y="50" font-size="30" text-anchor="middle">'+(o.title||'1日の気温の変化')+'</text>';
  if(o.date) s+='<text x="'+Rr+'" y="50" font-size="24" text-anchor="end">'+o.date+'</text>';
  (o.s||[]).forEach(sr=>{
    const pts=[]; sr.v.forEach((v,i)=>{ if(v!=null) pts.push([X(i),Y(v)]); });
    const c=sr.c||'#222';
    s+='<polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="'+c+'" stroke-width="4" stroke-linejoin="round"/>';
    pts.forEach(p=>{ s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="7" fill="'+c+'"/>'; });
  });
  (o.circle||[]).forEach(c=>{ s+='<circle cx="'+X(c[0])+'" cy="'+Y(c[1])+'" r="24" fill="none" stroke="'+RED+'" stroke-width="6"/>'; });
  (o.hline||[]).forEach(h=>{ const y=Y(h[0]), x2=h[1]==null?Rr:X(h[1]);
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="'+RED+'" stroke-width="4" stroke-dasharray="12 8"/>'; });
  (o.arrow||[]).forEach(a=>{ s+='<line x1="'+X(a[0])+'" y1="'+Y(a[1])+'" x2="'+X(a[2])+'" y2="'+Y(a[3])+'" stroke="'+RED+'" stroke-width="7" stroke-linecap="round" marker-end="url(#ah)"/>'; });
  (o.span||[]).forEach(a=>{
    const x=X(a[0]), m=a[4]||'ah', c=m==='ab'?KUMO:RED;
    s+='<line x1="'+x+'" y1="'+Y(a[1])+'" x2="'+x+'" y2="'+Y(a[2])+'" stroke="'+c+'" stroke-width="6" marker-start="url(#'+m+')" marker-end="url(#'+m+')"/>'+
       '<text x="'+x+'" y="'+(a[5]==='below'?f1(Y(a[1])+40):f1(Y(a[2])-16))+'" text-anchor="middle" font-size="26" fill="'+c+'" '+LBL+'>'+a[3]+'</text>';
  });
  if(o.legend){
    const ly=Bt-(o.legend.length*38+16)-12;   /* 凡例は 左下（線と重ならない所） */
    let y=ly+32;
    s+='<rect x="'+(L+14)+'" y="'+ly+'" width="200" height="'+(o.legend.length*38+16)+'" rx="8" fill="#fff" stroke="#bbb" stroke-width="2"/>';
    o.legend.forEach(g=>{
      s+='<line x1="'+(L+28)+'" y1="'+(y-9)+'" x2="'+(L+74)+'" y2="'+(y-9)+'" stroke="'+g[1]+'" stroke-width="5"/>'+
         '<circle cx="'+(L+51)+'" cy="'+(y-9)+'" r="7" fill="'+g[1]+'"/>'+
         '<text x="'+(L+86)+'" y="'+y+'" font-size="26">'+g[0]+'</text>';
      y+=38;
    });
  }
  return SVGURL(s+'</svg>');
}

/* 気温の表　t:[[上の行,下の行],…]　v:[気温,…]　hl:黄色にする列　mark:赤いわくの列 */
function TABLE(o){
  const W=1000,H=250,L=20,hw=170,top=20,h1=120,h2=100,n=o.t.length,cw=(W-L*2-hw)/n;
  let s=SVGHEAD(W,H)+'<rect width="'+W+'" height="'+H+'" fill="#fff"/>'+
    '<rect x="'+L+'" y="'+top+'" width="'+(W-2*L)+'" height="'+h1+'" fill="#eef3d6"/>'+
    '<rect x="'+L+'" y="'+top+'" width="'+hw+'" height="'+(h1+h2)+'" fill="#d6e6f2"/>';
  if(o.hl!=null) s+='<rect x="'+f1(L+hw+cw*o.hl)+'" y="'+top+'" width="'+f1(cw)+'" height="'+(h1+h2)+'" fill="#ffe7a0"/>';
  s+='<rect x="'+L+'" y="'+top+'" width="'+(W-2*L)+'" height="'+(h1+h2)+'" fill="none" stroke="#3aa0c8" stroke-width="3"/>'+
     '<line x1="'+L+'" y1="'+(top+h1)+'" x2="'+(W-L)+'" y2="'+(top+h1)+'" stroke="#3aa0c8" stroke-width="2"/>';
  for(let i=0;i<=n;i++){ const x=f1(L+hw+cw*i); s+='<line x1="'+x+'" y1="'+top+'" x2="'+x+'" y2="'+(top+h1+h2)+'" stroke="#3aa0c8" stroke-width="2"/>'; }
  s+='<text x="'+(L+hw/2)+'" y="'+(top+h1/2+12)+'" text-anchor="middle" font-size="34">時こく</text>'+
     '<text x="'+(L+hw/2)+'" y="'+(top+h1+h2/2+12)+'" text-anchor="middle" font-size="34">気温</text>';
  o.t.forEach((t,i)=>{
    const x=f1(L+hw+cw*(i+.5));
    if(t[1]) s+='<text x="'+x+'" y="'+(top+50)+'" text-anchor="middle" font-size="32">'+t[0]+'</text><text x="'+x+'" y="'+(top+100)+'" text-anchor="middle" font-size="32">'+t[1]+'</text>';
    else     s+='<text x="'+x+'" y="'+(top+h1/2+12)+'" text-anchor="middle" font-size="32">'+t[0]+'</text>';
    s+='<text x="'+x+'" y="'+(top+h1+h2/2+14)+'" text-anchor="middle" font-size="40">'+o.v[i]+'℃</text>';
  });
  if(o.mark!=null) s+='<rect x="'+f1(L+hw+cw*o.mark+4)+'" y="'+(top+4)+'" width="'+f1(cw-8)+'" height="'+(h1+h2-8)+'" rx="12" fill="none" stroke="'+RED+'" stroke-width="7"/>';
  return SVGURL(s+'</svg>');
}

/* 空のようす（真上を 見上げた 空）　'hare'：晴れ　'kumori'：くもり */
function SKY(k){
  let s=SVGHEAD(600,600)+'<defs><radialGradient id="g" cx="50%" cy="45%" r="55%">'+
    (k==='hare'
      ? '<stop offset="0" stop-color="#d7efff"/><stop offset=".55" stop-color="#4f9de0"/><stop offset="1" stop-color="#174f9c"/>'
      : '<stop offset="0" stop-color="#e8e8e8"/><stop offset=".6" stop-color="#a8a8a8"/><stop offset="1" stop-color="#5e5e5e"/>')+
    '</radialGradient><clipPath id="c"><circle cx="300" cy="300" r="270"/></clipPath>'+
    '<filter id="b"><feGaussianBlur stdDeviation="9"/></filter></defs>'+
    '<rect width="600" height="600" fill="#f7f1e3"/><circle cx="300" cy="300" r="270" fill="url(#g)"/>'+
    '<g clip-path="url(#c)" filter="url(#b)">';
  const E=(a,f,op)=>a.map(e=>'<ellipse cx="'+e[0]+'" cy="'+e[1]+'" rx="'+e[2]+'" ry="'+e[3]+'" fill="'+f+'" opacity="'+op+'"/>').join('');
  if(k==='hare'){
    s+='<circle cx="300" cy="270" r="70" fill="#fff" opacity=".85"/>';
    s+=E([[110,470,95,40],[480,135,85,35],[505,440,70,30],[150,140,60,25]],'#fff',.9);
  }else{
    s+=E([[200,200,150,75],[410,180,130,65],[300,330,180,85],[140,410,120,65],[460,420,140,65],[300,490,160,55],[330,100,140,55]],'#f2f2f2',.75);
    s+=E([[250,260,100,45],[430,300,90,40],[200,450,80,35]],'#7d7d7d',.5);
  }
  s+='</g>';
  if(k==='hare') s+='<circle cx="300" cy="270" r="26" fill="#fff"/>';
  s+='<circle cx="300" cy="300" r="270" fill="none" stroke="#888" stroke-width="4"/>';
  return SVGURL(s+'</svg>');
}

/* ── タブB（1日の気温の変化）の絵 ── テスト「2」5月15日 */
const B_T=[['午前','10時'],['午前','11時'],['正午',''],['午後','1時'],['午後','2時'],['午後','3時']];
const B_V=[16,19,21,23,25,23];
/* ランダム用：朝は低く、午後2時がいちばん高く、3時に下がる */
const B_RAND=()=>{ const r=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1)); const v=[r(14,18)];
  v.push(v[0]+r(1,3)); v.push(v[1]+r(1,2)); v.push(v[2]+r(0,2)); v.push(v[3]+r(1,3)); v.push(v[4]-r(1,3)); return v; };
const B_X=['午前10','11','正午','午後1','2','3'];
const IMG_B1=TABLE({t:B_T,v:B_V});                       /* 表 */
const IMG_B1H=TABLE({t:B_T,v:B_V,hl:3,mark:3});          /* ヒント用：午後1時の列に赤いわく */
const IMG_B2=GRAPH({x:B_X,date:'5月15日',s:[{v:B_V}]});   /* 折れ線グラフ */
const IMG_B2H=GRAPH({x:B_X,date:'5月15日',s:[{v:B_V}],band:4,circle:[[4,B_V[4]]]});  /* ヒント用：いちばん高い点 */
const IMG_B2E=GRAPH({x:B_X,date:'5月15日'});                 /* 点のないグラフ（点をうつ問題用） */
/* 表（上）と グラフ（下）を 1まいに重ねる */
function STACK(top,bottom){
  let s=SVGHEAD(1000,820)+'<rect width="1000" height="820" fill="#fff"/>'+
    '<image href="'+top+'" x="0" y="0" width="1000" height="250"/>'+
    '<image href="'+bottom+'" x="120" y="270" width="760" height="540"/>';
  return SVGURL(s+'</svg>');
}
const IMG_B12=STACK(IMG_B1,IMG_B2);                                          /* 表とグラフ */
const IMG_B12H1=STACK(IMG_B1H,IMG_B2);                                       /* ヒント用：表の午後1時に赤いわく */
const IMG_B12H2=STACK(TABLE({t:B_T,v:B_V,hl:4}),IMG_B2H);                    /* ヒント用：午後2時を黄色・グラフに赤丸 */
/* グラフを読む問題（問題に gen:B_READ('…') と書く）。問題に入るたびに、B_RAND でグラフの数字が かわる
   'temp'：○時の気温は何℃？　'time'：○℃だったのは何時？　'rise'：いちばん大きく上がった1時間は？ */
const B_LAB=['午前10時','午前11時','正午','午後1時','午後2時','午後3時'];
const B_HOUR=['午前10時〜11時','午前11時〜正午','正午〜午後1時','午後1時〜2時','午後2時〜3時'];
function B_READ(kind){ return function(){
  let v=B_RAND(), k=0;
  for(let n=0;n<60;n++){
    v=B_RAND(); k=Math.floor(Math.random()*6);
    if(kind==='temp') break;
    if(kind==='time'&&v.filter(x=>x===v[k]).length===1) break;
    if(kind==='rise'){ const d=v.slice(1).map((x,j)=>x-v[j]), m=Math.max(...d); k=d.indexOf(m); if(d.filter(x=>x===m).length===1) break; }
  }
  const g={x:B_X, s:[{v:v}]}, Q=R('気温','きおん');
  const o={img:GRAPH(g), imgCap:'1'+R('日','にち')+'の'+Q+'の グラフ'};
  if(kind==='temp'){
    o.ans=v[k]+'℃';
    o.opts=shuffle([o.ans].concat(shuffle([-2,-1,1,2]).slice(0,3).map(d=>(v[k]+d)+'℃')));
    o.text='上のグラフで、'+B_LAB[k]+'の'+Q+'は、'+B+'です。';
    o.hintImg=GRAPH({...g, band:k, circle:[[k,v[k]]], hline:[[v[k],k]]});
  }else if(kind==='time'){
    o.ans=B_LAB[k];
    o.opts=shuffle([o.ans].concat(shuffle(B_LAB.filter(x=>x!==o.ans)).slice(0,3)));
    o.text='上のグラフで、'+Q+'が '+v[k]+'℃だったのは、'+B+'です。';
    o.hintImg=GRAPH({...g, hline:[[v[k],null]]});
  }else{
    o.ans=B_HOUR[k];
    o.opts=shuffle([o.ans].concat(shuffle(B_HOUR.filter(x=>x!==o.ans)).slice(0,3)));
    o.text='上のグラフで、'+Q+'が いちばん '+R('大','おお')+'きく '+R('上','あ')+'がったのは、'+B+'の 1'+R('時間','じかん')+'です。';
    o.hintImg=GRAPH({...g, span:v.slice(1).map((x,j)=>[j+.5,Math.min(v[j],x),Math.max(v[j],x),'',x>=v[j]?'ah':'ab']).filter(a=>a[1]!==a[2])});
  }
  return o;
}; }

let CURSRC=null;
function drawBoard(cards){
  CURSRC=cards;
  cards=cards.filter(c=>!(c.quizOnly&&mode!=='quiz'));   /* quizOnly のカードは「問題」のときだけ */
  CURCARDS=cards;
  board.innerHTML=cards.map(c=>{
    const inner=c.img
      ? '<img class="'+(c.fit==='contain'?'contain':'')+'" src="'+c.img+'" alt=""><span class="cap">'+c.cap+'</span>'
      : '<span class="dh">'+c.head+'</span><span class="dt">'+c.short+'</span>';
    return '<button class="card'+(c.img?'':' doc '+c.tone)+'" data-k="'+c.k+'" aria-pressed="false">'+
           '<span class="badge">'+DISP(c.k)+'</span><span class="stamp"></span>'+inner+'</button>';
  }).join('');
  board.classList.toggle('n5',cards.length===5);
  board.classList.toggle('n6',cards.length===6);
  board.style.setProperty('--n',cards.length);
  board.style.display=cards.length===1?'none':'';   /* カードが1まいなら 下の列は出さない（上の絵を大きく） */
  showBig(cards[0].k);
}
/* 上に大きく見せる（下のカードをおすと入れかわる） */
const bigview=el('bigview'); let BIGK=null;
let BIGIMG=null;   /* ヒントで絵だけさしかえているとき、その絵 */
function showBig(k,img,cap){
  const d0=CURCARDS.find(x=>x.k===k)||CURCARDS[0]; BIGK=d0.k; BIGIMG=img||null;
  const d=img?{...d0,img}:d0;
  if(cap) d.cap=cap;   /* カードにない絵（2まいならべた絵など）を出すとき：番号の丸は出さない */
  bigview.innerHTML=(cap?'':'<span class="badge">'+DISP(d.k)+'</span>')+'<span class="stamp"></span>'+
    (d.img ? '<img src="'+d.img+'" alt=""><p class="bcap">'+d.cap+'</p>'
           : '<div class="bdoc '+(d.tone||'')+'"><span class="dh">'+d.head+'</span><span class="dt">'+d.short+'</span></div>');
  bigview.classList.remove('right');
  [...board.children].forEach(c=>c.classList.toggle('cur',!cap&&c.dataset.k===d.k));
}

/* そのばめんの先頭まで、アニメの時計を進める（--t にマイナスのちえんを入れる） */
function seekTo(k){
  const g=stage.firstElementChild; if(!g) return;
  g.classList.remove('run','paused');
  void g.getBoundingClientRect();
  g.style.setProperty('--t','-'+MV.chapters[k].at+'s');
  g.classList.add('run');
  if(!mvPlaying) g.classList.add('paused');
}
function showScene(k){
  mvI=k; seekTo(k);
  mvRemain=MV.chapters[k].wait*1000; mvFrom=Date.now();
  [...el('mdots').children].forEach((d,n)=>d.classList.toggle('on',n<=k));
  const cap=el('mcap');
  cap.innerHTML=MV.chapters[k].cap;
  cap.classList.remove('in'); void cap.offsetWidth; cap.classList.add('in');
  el('mstep').textContent=(k+1)+' / '+MV.chapters.length;
  el('mprev').disabled=(k===0);
  el('mnext').disabled=(k===MV.chapters.length-1);
  setPlayBtn();
}
function playMovie(){
  if(!MV) return;
  if(mvDone){ mvDone=false; mvPlaying=true; showScene(0); }
  mvPlaying=true;
  const g=stage.firstElementChild; if(g) g.classList.remove('paused');
  mvFrom=Date.now();
  clearTimeout(mvTimer); mvTimer=setTimeout(nextChap,mvRemain);
  setPlayBtn();
}
function nextChap(){
  if(mvI<MV.chapters.length-1){
    showScene(mvI+1);
    clearTimeout(mvTimer); mvTimer=setTimeout(nextChap,mvRemain);
  }else{
    mvPlaying=false; mvDone=true;
    const g=stage.firstElementChild; if(g) g.classList.add('paused');
    setPlayBtn();
  }
}
function stopMovie(){
  if(mvPlaying) mvRemain=Math.max(400,mvRemain-(Date.now()-mvFrom));
  mvPlaying=false; clearTimeout(mvTimer);
  const g=stage&&stage.firstElementChild; if(g) g.classList.add('paused');
  setPlayBtn();
}
function setPlayBtn(){
  if(!MV) return;
  el('mplay').textContent = mvPlaying ? '■ とめる' : (mvDone ? '↻ もういちど' : '▶ さいせい');
}
el('mplay').addEventListener('click',()=>{ mvPlaying?stopMovie():playMovie(); });
el('mprev').addEventListener('click',()=>{ stopMovie(); mvDone=false; if(mvI>0) showScene(mvI-1); });
el('mnext').addEventListener('click',()=>{ stopMovie(); mvDone=false; if(mvI<MV.chapters.length-1) showScene(mvI+1); });

/* 出題 */
const QSUB={fill:'ことばを えらぼう', pick:'ばんごうを えらぼう', multi:'ただしいものを えらぼう', word:'ことばを えらぼう', plot:'グラフに 点を うとう'};

/* ── グラフに点をうつ問題（mode:'plot'）──
   上の大きな絵のところに、表（q.top）と 点のないグラフ（q.base）を出し、その上に 点をうつ。
   GRAPH() と同じ大きさ（760×540・わく 110〜700 × 80〜450・0〜30℃）で 重ねている。
   点は どのじゅんでも うてる。ぜんぶ うつと 左から じゅんに 線がひかれて、はなまる。 */
const PG={L:110,R:700,T:80,B:450,ymax:30,ox:120,oy:270};
let PL=null;
const SVGNS='http://www.w3.org/2000/svg';
function plotStart(q,vals){
  const v=vals||q.v, n=v.length, st=(PG.R-PG.L)/n, given=Math.min(q.given||0,n);
  const top=vals&&q.t?TABLE({t:q.t,v:v}):q.top;   /* ランダムのときは 表も かきなおす */
  PL={q:q, v:v, n:n, given:given, st:st, X:k=>PG.L+st*(k+.5), Y:y=>PG.B-y/PG.ymax*(PG.B-PG.T), done:Array(n).fill(false), left:n-given, down:false};
  bigview.innerHTML='<svg class="plotsvg" viewBox="0 0 1000 820" preserveAspectRatio="xMidYMid meet">'+
    '<image href="'+top+'" x="0" y="0" width="1000" height="250"/>'+
    '<g transform="translate('+PG.ox+','+PG.oy+')">'+
     '<image href="'+q.base+'" x="0" y="0" width="760" height="540"/>'+
     '<g id="plLines"></g><g id="plDots"></g>'+
     '<g id="plGhost" style="display:none">'+
      '<line id="plGl" stroke="#e0a52c" stroke-width="3" stroke-dasharray="7 6"/>'+
      '<circle id="plGc" r="10" fill="rgba(224,165,44,.25)" stroke="#e0a52c" stroke-width="4"/>'+
      '<text id="plGt" font-size="30" font-weight="700" fill="#a97a12" stroke="#fff" stroke-width="7" paint-order="stroke"></text>'+
     '</g>'+
    '</g></svg>';
  const svg=bigview.querySelector('.plotsvg');
  svg.addEventListener('pointerdown',e=>{ if(locked||!PL) return; e.preventDefault(); PL.down=true;
    try{ svg.setPointerCapture(e.pointerId); }catch(err){} plGhost(plSnap(e)); });
  svg.addEventListener('pointermove',e=>{ if(PL&&(PL.down||e.pointerType==='mouse')) plGhost(plSnap(e)); });
  svg.addEventListener('pointerup',e=>{ if(!PL||!PL.down) return; PL.down=false; const sn=plSnap(e); plGhost(null); if(sn) plPut(sn); });
  svg.addEventListener('pointercancel',()=>{ if(PL){ PL.down=false; plGhost(null); } });
  svg.addEventListener('pointerleave',e=>{ if(PL&&!PL.down&&e.pointerType==='mouse') plGhost(null); });
  /* はじめから うってある 点と 線（given こ） */
  for(let k=0;k<given;k++){
    PL.done[k]=true;
    const c=document.createElementNS(SVGNS,'circle');
    c.setAttribute('cx',PL.X(k)); c.setAttribute('cy',PL.Y(v[k])); c.setAttribute('r',9); c.setAttribute('fill','#222');
    el('plDots').appendChild(c);
    if(k>0){
      const l=document.createElementNS(SVGNS,'line');
      l.setAttribute('x1',PL.X(k-1)); l.setAttribute('y1',PL.Y(v[k-1])); l.setAttribute('x2',PL.X(k)); l.setAttribute('y2',PL.Y(v[k]));
      l.setAttribute('stroke','#222'); l.setAttribute('stroke-width','4'); l.setAttribute('stroke-linecap','round');
      el('plLines').appendChild(l);
    }
  }
  choices.innerHTML=q.lab.map((l,k)=>'<span class="pchip'+(k<given?' pre':'')+'" data-k="'+k+'">'+l+'<b>'+(k<given?v[k]+'℃':'？')+'</b></span>').join('')+
    (q.rand?'<button class="prand" type="button">🎲 ランダム（ひょうの 数を かえる）</button>':'');
  const rb=choices.querySelector('.prand');
  if(rb) rb.addEventListener('click',()=>{ if(!locked) plotStart(q,q.rand()); });
  msg.textContent='あと'+PL.left+'こ';
}
function plSnap(e){
  const svg=bigview.querySelector('.plotsvg'); if(!svg||!PL) return null;
  const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY;
  const m=p.matrixTransform(svg.getScreenCTM().inverse()), x=m.x-PG.ox, y=m.y-PG.oy;
  if(x<PG.L-12||x>PG.R+12||y<PG.T-24||y>PG.B+24) return null;
  const k=Math.max(0,Math.min(PL.n-1,Math.floor((x-PG.L)/PL.st))), step=PL.q.step||1;
  let v=Math.round((PG.B-y)/(PG.B-PG.T)*PG.ymax/step)*step;
  v=Math.max(0,Math.min(PG.ymax,v));
  return {k:k,v:v};
}
function plGhost(sn){
  const g=el('plGhost'); if(!g) return;
  if(!sn||PL.done[sn.k]){ g.style.display='none'; return; }
  const x=PL.X(sn.k), y=PL.Y(sn.v);
  g.style.display='';
  const help=el('hintbtn').classList.contains('on');   /* ○℃ と点線は ヒントが出ているときだけ */
  el('plGl').style.display=help?'':'none'; el('plGt').style.display=help?'':'none';
  const l=el('plGl'); l.setAttribute('x1',PG.L); l.setAttribute('x2',x); l.setAttribute('y1',y); l.setAttribute('y2',y);
  const c=el('plGc'); c.setAttribute('cx',x); c.setAttribute('cy',y);
  const t=el('plGt'); t.setAttribute('x',x+16); t.setAttribute('y',y-14); t.textContent=sn.v+'℃';
}
function plPut(sn){
  if(locked||!PL||PL.done[sn.k]) return;
  const x=PL.X(sn.k), y=PL.Y(sn.v);
  if(sn.v===PL.v[sn.k]){
    PL.done[sn.k]=true; PL.left--;
    const c=document.createElementNS(SVGNS,'circle');
    c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',9); c.setAttribute('fill','#222'); c.setAttribute('class','pl-pop');
    el('plDots').appendChild(c);
    const ch=choices.querySelector('.pchip[data-k="'+sn.k+'"]');
    if(ch){ ch.classList.add('ok'); ch.querySelector('b').textContent=sn.v+'℃'; }
    if(PL.left) msg.textContent='あと'+PL.left+'こ！'; else plFinish();
  }else{
    curWrong=true;
    const t=document.createElementNS(SVGNS,'text');
    t.setAttribute('x',x); t.setAttribute('y',y+12); t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size','40'); t.setAttribute('font-weight','700'); t.setAttribute('fill','#9a9a9a'); t.setAttribute('class','pl-x');
    t.textContent='×'; el('plDots').appendChild(t); setTimeout(()=>t.remove(),950);
    msg.innerHTML='おしい！　'+R('表','ひょう')+'の '+PL.q.lab[sn.k]+' の'+R('気温','きおん')+'を '+R('見','み')+'てみよう';
    /* まちがいの数を 10問チャレンジ・テストの練習にも つたえる（×になった選択肢と同じあつかい） */
    const m=document.createElement('button'); m.className='opt ng'; m.hidden=true; choices.appendChild(m); m.click(); m.remove();
  }
}
function plFinish(){
  locked=true; msg.textContent='';
  const tok=PL, V=PL.v, n=PL.n, gap=420, k0=Math.max(0,PL.given-1), cnt=n-1-k0;
  for(let j=0;j<cnt;j++) setTimeout(()=>{
    if(PL!==tok) return;
    const k=k0+j, l=document.createElementNS(SVGNS,'line'), x1=PL.X(k), y1=PL.Y(V[k]), x2=PL.X(k+1), y2=PL.Y(V[k+1]);
    const len=Math.hypot(x2-x1,y2-y1);
    l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke','#222'); l.setAttribute('stroke-width','4'); l.setAttribute('stroke-linecap','round');
    l.style.strokeDasharray=len; l.style.strokeDashoffset=len;
    el('plLines').appendChild(l); void l.getBoundingClientRect();
    l.style.transition='stroke-dashoffset .38s linear'; l.style.strokeDashoffset=0;
  },gap*j);
  setTimeout(()=>{
    if(PL!==tok) return;
    award(); ping(); hanamaru();
    msg.textContent='せいかい！　'+'折れ線グラフが できたね！';
    next();
  },gap*Math.max(0,cnt-1)+250);
}
let FILLI=0;
function fillShow(q){   /* FILLI ばんめの 空らんを 光らせて、その 選択肢を 出す */
  el('say').querySelectorAll('.blank').forEach(x=>x.classList.toggle('now',+x.dataset.b===FILLI));
  choices.innerHTML=shuffle(q.blanks[FILLI].opts).map(o=>'<button class="opt" data-v="'+o+'">'+o+'</button>').join('');
}
function render(){
  if(QS[i].gen) QS[i]=Object.assign({},QS[i],QS[i].gen());   /* グラフを読む問題：入るたびに 作りなおす */
  const q=QS[i]; locked=false; hit=0; curWrong=false; PL=null;
  if(q.cards&&q.cards!==CURSRC) drawBoard(q.cards);   /* まとめタブ用 */
  resetHint();
  vQuiz.dataset.q=q.mode;
  el('qnum').textContent=i+1;
  el('qsub').textContent=SECTIONS[sec].sets[setIdx].sub||q.sub||QSUB[q.mode]||'';
  el('say').innerHTML=q.text;
  msg.textContent='';
  clearCards();
  board.classList.remove('locked');
  if(q.img) showBig(q.card||CURCARDS[0].k,q.img,q.imgCap||' ');   /* カードにない絵を 上に出す */
  else showBig(q.card||CURCARDS[0].k);   /* 前の問題で見ていたカードは もちこさない */
  if(q.mode==='plot'){ choices.style.display='grid'; plotStart(q,q.rand?q.rand():null); return; }   /* グラフに点をうつ（rand があれば はじめから ランダム） */
  if(q.mode==='pick'){
    choices.style.display='grid';
    choices.innerHTML=CURCARDS.map(c=>'<button class="opt" data-v="'+c.k+'">'+DISP(c.k)+'</button>').join('');
  }
  else if(q.mode==='fill'){ choices.style.display='grid'; FILLI=0; fillShow(q); }
  else if(q.mode==='word'){
    choices.style.display='grid';
    choices.innerHTML=q.opts.map(o=>'<button class="opt" data-v="'+o+'">'+o+'</button>').join('');
  }else{
    choices.style.display='grid';
    choices.innerHTML=q.opts.map((o,n)=>'<button class="opt" data-n="'+n+'"><span class="mk">（　）</span><span>'+o.t+'</span></button>').join('');
  }
}

/* ヒント */
const hintBtn=el('hintbtn'), qhint=el('qhint');
let hintBag=[], lastHint='';
function resetHint(){
  hintBtn.disabled=false; hintBtn.classList.remove('on');
  qhint.classList.remove('on'); qhint.innerHTML=''; qhint.style.visibility='';
  hintBag=[]; lastHint='';
}
hintBtn.addEventListener('click',()=>{
  if(!QS.length||!QS[i]) return;
  /* 出ているときは、押すと引っこむ */
  if(qhint.classList.contains('on')){
    qhint.classList.remove('on'); hintBtn.classList.remove('on'); return;
  }
  const hs=QS[i].hint;
  const list=(Array.isArray(hs)?hs:[hs]).filter(Boolean);
  if(!list.length) list.push('しりょうをもういちど、よく'+R('見','み')+'てみよう。');
  if(!hintBag.length){                       /* ぜんぶ出たらまたシャッフル */
    hintBag=shuffle(list);
    if(hintBag.length>1&&hintBag[0]===lastHint) hintBag.push(hintBag.shift());
  }
  lastHint=hintBag.shift();
  qhint.innerHTML='<b>ヒント</b>'+lastHint;
  qhint.classList.add('on'); hintBtn.classList.add('on');
  if(QS[i].hintImg) showBig(QS[i].hintCard||QS[i].card,QS[i].hintImg,QS[i].img?(QS[i].imgCap||' '):undefined);   /* ヒント用に しるしを つけた絵 */
  else if(QS[i].hintCard) showBig(QS[i].hintCard);   /* ヒントの絵を 上に大きく */
});

function ping(){ const a=el('pinpon'); a.currentTime=0; a.play().catch(()=>{}); }
function hanamaru(){ const b=el('big'); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go'); }

function award(){                       /* 1回で当たったら○、まちがえた問題は控えておく */
  if(curWrong) MISSED.push(QS[i]); else score++;
  dots[i].classList.add('on');
}
function correct(target){
  locked=true; award();
  ping();
  const q=QS[i];
  target.classList.add('ok');
  choices.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  if(q.mode==='pick'){
    const c=[...board.children].find(x=>x.dataset.k===q.ans);
    if(c) c.classList.add('right');   /* 正解のしゃしんの上にはなまるを1つだけ */
    showBig(q.ans); bigview.classList.add('right');   /* 上の大きな絵にも */
  }else{
    hanamaru();
    const bl=el('bl'); if(bl) bl.textContent=q.ans;
  }
  msg.textContent='せいかい！';
  next();
}
function next(){ setTimeout(()=>{ i++; i<QS.length?render():finish(); },1500); }

choices.addEventListener('click',e=>{
  const b=e.target.closest('.opt'); if(!b||b.disabled||locked) return;
  const q=QS[i];
  if(q.mode==='plot') return;   /* 点をうつ問題は グラフの上で 答える */
  if(q.mode==='fill'){   /* 空らんを 左から じゅんに うめる。ぜんぶ うまったら 正解（音は そのとき 1回） */
    const bk=q.blanks[FILLI];
    if(b.dataset.v!==bk.ans){ curWrong=true; b.classList.add('ng'); b.disabled=true; msg.textContent='おしい！　もういちど'; return; }
    const sp=el('say').querySelector('.blank[data-b="'+FILLI+'"]'); if(sp){ sp.textContent=bk.ans; sp.classList.remove('now'); }
    FILLI++;
    if(FILLI<q.blanks.length){ fillShow(q); msg.textContent='あと'+(q.blanks.length-FILLI)+'つ！'; return; }
    locked=true; award(); ping(); hanamaru();
    b.classList.add('ok'); choices.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    msg.textContent='せいかい！'; next(); return;
  }
  if(q.mode==='word'||q.mode==='pick'){ q.ans===b.dataset.v?correct(b):(curWrong=true,b.classList.add('ng'),b.disabled=true,msg.textContent='おしい！　もういちど'); return; }
  const o=q.opts[+b.dataset.n];
  if(o.ok){
    b.classList.add('ok'); b.disabled=true; b.querySelector('.mk').textContent='（○）';
    hit++; ping();
    if(hit===q.need){
      locked=true; award(); hanamaru();
      choices.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      msg.textContent='せいかい！'; next();
    }else msg.textContent='あと'+(q.need-hit)+'つ！';
  }else{
    curWrong=true;
    b.classList.add('ng'); b.disabled=true; b.querySelector('.mk').textContent='（×）';
    msg.textContent='おしい！　もういちど';
  }
});

function finish(){
  el('qhead').style.display='none'; el('saybox').style.display='none';
  qhint.classList.remove('on'); qhint.style.visibility='hidden';
  choices.style.display='none'; msg.style.display='none';
  el('score').textContent=score;
  const rt=el('retry');
  rt.hidden=!MISSED.length;
  if(MISSED.length) rt.textContent='まちがえた '+MISSED.length+'もんだけ';
  el('result').classList.add('on');
  board.classList.remove('locked');
  [...board.children].forEach(c=>c.classList.remove('ng','right'));
  bigview.classList.remove('right');
}

function reset(){
  i=0; score=0; locked=false; hit=0; MISSED=[];
  QS=(ordered?BASEQ.slice():shuffle(BASEQ)).map(q=>q.opts?{...q,opts:shuffle(q.opts)}:q);
  dots.forEach(d=>d.classList.remove('on'));
  el('qhead').style.display=''; el('saybox').style.display='';
  choices.style.display=''; msg.style.display='';
  el('result').classList.remove('on');
  render();
}

el('again').addEventListener('click',reset);
el('retry').addEventListener('click',()=>{ if(MISSED.length) startList(MISSED.slice(), true); });
loadSection();
</script>

<!-- ============================================================
     🏁 10問チャレンジ（rika_base2 で 新しく 作った）— ふつうは さわらない
     ・まとめの 問題（ALLQ）から ランダムに 10問（10問より 少なければ ぜんぶ）。
     ・はかるもの：かかった 時間・まちがえた 回数（×に なった 選択肢の 数）。
     ・けっか画面に 記録を 出す。その日の さいこう記録を ブラウザに のこす。
     ・タブ・説明／問題・小タブを おすと チャレンジは おわる。
     ・テストの練習を 始めると 切れる（①せってい の chalBtn:'#chal-btn'）。
     ・名前は 算数の challenge10.js に 合わせて Challenge10（isOn・start・stop・reset）。
       ただし 中身は べつもの（算数の ものを はっても そのままでは うごかない）。
     ============================================================ -->
<style>
  #chal-mount{flex:0 0 auto; margin-left:.4rem;}
  body.chal #chal-mount{margin-left:auto;}   /* テストの ボタンが かくれても 右はしに */
  #chal-btn{background:#fff; border:.15rem solid var(--ai); color:var(--ai); border-radius:999px;
            padding:.22rem .9rem; font-weight:700; font-size:.92rem; white-space:nowrap; box-shadow:0 2px 0 var(--ai2);}
  #chal-btn:hover{background:var(--ai); color:#fff;}
  body.chal #chal-btn{background:var(--syu); border-color:var(--syu); color:#fff; box-shadow:0 2px 0 #9e2a20;}
  #chal-res{font-size:1.1rem; font-weight:700; color:var(--ai); line-height:1.8;}
  #chal-res b{color:var(--syu); font-size:1.35em; margin:0 .1rem;}
  #chal-res small{display:block; font-size:.9rem; color:#5c7b8d; font-weight:400;}
</style>
<script>
const CHAL_TOTAL = 10;                                  /* 問題の 数 */
const CHAL_RECORD = true;                               /* その日の さいこう記録を のこすか */

window.Challenge10 = (function(){
  let on = false, state = '', t0 = 0, miss = 0;
  const btn = document.createElement('div');
  btn.id = 'chal-mount';
  btn.innerHTML = '<button id="chal-btn" type="button">🏁 10問チャレンジ</button>';
  document.querySelector('.bar1').appendChild(btn);
  const b = el('chal-btn');
  const res = document.createElement('p');
  res.id = 'chal-res';
  el('result').insertBefore(res, el('result').querySelector('.btns'));

  function label(){ b.textContent = on ? '🏁 チャレンジを やめる' : '🏁 10問チャレンジ'; }
  function start(){
    const k = SECTIONS.findIndex(s => s.quiz);          /* まとめタブで 出す */
    sec = k < 0 ? 0 : k; setIdx = 0;
    document.querySelectorAll('#tabs .tab').forEach((x,j) => x.classList.toggle('on', j === sec));
    on = true;                                          /* loadSection の 前に on（タブの クリックと まちがえない）*/
    loadSection();
    document.querySelectorAll('#subtabs .st').forEach(x => x.classList.remove('on'));
    const list = shuffle(ALLQ).slice(0, Math.min(CHAL_TOTAL, ALLQ.length));
    state = 'run'; t0 = Date.now(); miss = 0;
    document.body.classList.add('chal'); label();
    startList(list, true);
  }
  function stop(){
    on = false; state = '';
    document.body.classList.remove('chal'); label();
  }
  b.addEventListener('click', () => { on ? (stop(), loadSection()) : start(); });

  /* タブ・説明／問題・小タブを おしたら おわり */
  ['tabs','toggle','subtabs'].forEach(id => el(id).addEventListener('click', () => { if(on) stop(); }, true));
  /* まちがい：選択肢が × に なった 回数 */
  el('choices').addEventListener('click', e => {
    const o = e.target.closest('.opt');
    if(on && state === 'run' && o && o.classList.contains('ng') && !o.dataset.chMiss){ o.dataset.chMiss = '1'; miss++; }
  });
  /* けっか画面の「もういちど」＝ 新しい 10問。「まちがえた問題だけ」＝ チャレンジを おえて ふつうの やりなおし */
  el('again').addEventListener('click', e => {
    if(!on) return; e.stopImmediatePropagation(); start();
  }, true);
  el('retry').addEventListener('click', () => { if(on) stop(); }, true);

  function best(sec2){
    if(!CHAL_RECORD) return '';
    const d = new Date(), key = 'chal10:' + document.title + ':' + d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
    try{
      const old = JSON.parse(localStorage.getItem(key) || 'null');
      const now = { miss: miss, sec: sec2 };
      const better = !old || now.miss < old.miss || (now.miss === old.miss && now.sec < old.sec);
      if(better) localStorage.setItem(key, JSON.stringify(now));
      const bb = better ? now : old;
      return '<small>' + (better ? '🎉 きょうの さいこう記録！' : 'きょうの さいこう：' + bb.sec + 'びょう・まちがい ' + bb.miss + 'かい') + '</small>';
    }catch(err){ return ''; }
  }
  function end(){                                       /* finish から 呼ぶ */
    if(!on || state !== 'run') { res.innerHTML = ''; return; }
    state = 'end';
    const s = Math.round((Date.now() - t0) / 1000);
    res.innerHTML = '🏁 ' + QS.length + 'もん <b>' + s + '</b>びょう　まちがい <b>' + miss + '</b>かい' + best(s);
  }
  return { isOn: () => on, start: start, stop: stop, reset: () => { if(on) start(); }, end: end };
})();

/* セットを おえた とき：チャレンジなら 記録を 出す */
const CH_finish = finish;
finish = function(){ CH_finish.apply(this, arguments); Challenge10.end(); };
/* 出題：チャレンジ中は 見出しの 右の 文を かえる */
const CH_render = render;
render = function(){ CH_render.apply(this, arguments); if(Challenge10.isOn()) el('qsub').textContent = '🏁 10問チャレンジ'; };
</script>

<script>
/* はなまるの あと、つぎの 大問までの 時間（セットの けっか画面を 見せる 時間）*/
const HANAMARU_SHOW_MS = 2000, AUTO_NEXT_MS = 1000;

/* 小タブ ＝ 問題セット（しりょうタブ・まとめタブは 入れない）*/
const MODES = {};
SECTIONS.forEach((s, n) => {
  if (s.quiz || s.media || !s.sets) return;
  s.sets.forEach((st, k) => {
    MODES['s' + (n + 1) + '-' + (k + 1)] = {
      sec: n, set: k, label: s.tab + '：', sub: String(st.label).replace(/^\s*\d+\s*/, '')
    };
  });
});

/* セットを 開く（タブ・説明／問題・セットの ボタンの 見た目も 合わせる）*/
function trOpen(n, k, m) {
  sec = n; setIdx = k;
  document.querySelectorAll('#tabs .tab').forEach((x, j) => x.classList.toggle('on', j === n));
  document.querySelectorAll('.tg').forEach(x => x.classList.toggle('on', x.dataset.m === m));
  loadSection();
  document.querySelectorAll('#subtabs .st').forEach((x, j) => x.classList.toggle('on', j === k));
}

/* setMode：テスト中は その セットを 問題で 開く。
   テストが おわった あと（やめる・とじる）は、始める 前の 画面に もどす */
let TR_BACK = null, TR_GEN = 0;
function setMode(key) {
  TR_GEN++;                                   /* 前の 画面の「つぎの 問題へ」を 取り消す */
  if (!document.body.classList.contains('testing')) {
    if (TR_BACK) { const b = TR_BACK; TR_BACK = null; trOpen(b.sec, b.setIdx, b.m); }
    return;
  }
  if (!TR_BACK) {
    const t = document.querySelector('.tg.on');
    TR_BACK = { sec: sec, setIdx: setIdx, m: t ? t.dataset.m : 'explain' };
  }
  const md = MODES[key]; if (!md) return;
  trOpen(md.sec, md.set, 'quiz');
}

/* ②しくみ が 外から つつむ 2つ（テストを していない ときは 何も しない）*/
function showHanamaru() {}
function applyJudge(r) {}

};
/* 正解の 1.5秒あとに つぎの 問題へ（本体と 同じ）。
   とちゅうで 大問が かわったら（とばす・やめる）、古い「つぎへ」は 取り消す */
next = function () {
  const g = TR_GEN;

<script>

  if (tests.length > 1) tests.push({ title: 'ぜんぶの テスト', items: all.map((k, j) => ({ no: String(j + 1), mode: k })) });

}

  document.head.appendChild(css);

  /* ---- ボタン・メニュー・帯（10問チャレンジの となり）---- */
  const mount = document.createElement('div');
  mount.id = 'test-mount';
  mount.innerHTML =
      '<button id="test-btn" type="button">' + (S.button || '📝 テストの 練習') + '</button>'
    + '<div id="test-menu">'
    +   TESTS.map((t,k) => '<button type="button" data-k="'+k+'">'+t.title+'<small>'+t.items.length+'問</small></button>').join('')
    + '</div>'
    + '<div id="test-bar"><span id="test-no"></span><span id="test-dots"></span>'
    +   '<button id="test-stop" type="button">やめる</button></div>';
  const anchor = q(P.after);
  const header = document.querySelector('header');
  if(anchor && anchor.parentNode) anchor.parentNode.insertBefore(mount, anchor.nextSibling);
  else if(header) header.appendChild(mount);
  else document.body.insertBefore(mount, document.body.firstChild);
  const res = document.createElement('div');
  res.id = 'test-result';
  document.body.appendChild(res);

  /* テストが 1つだけなら、メニューを 出さずに すぐ 始める */
  $('test-btn').addEventListener('click', e => {
    e.stopPropagation();
    if(TESTS.length === 1){ start(0); return; }
    const m = $('test-menu');
    m.classList.toggle('open');
    if(m.classList.contains('open')) placeMenu();
  });
  /* せまい 画面で メニューが 左に はみ出す ときは、画面の 中へ ずらす */
  function placeMenu(){
    const m = $('test-menu');
    m.style.left = ''; m.style.right = '';
    const r = m.getBoundingClientRect(), mr = mount.getBoundingClientRect();
    if(r.left < 8){ m.style.right = 'auto'; m.style.left = (8 - mr.left) + 'px'; }
  }
  $('test-menu').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if(!b) return;
    $('test-menu').classList.remove('open');
    start(+b.dataset.k);
  });
  document.addEventListener('click', e => {
    if(!e.target.closest('#test-mount')) $('test-menu').classList.remove('open');
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape') $('test-menu').classList.remove('open');
  });
  $('test-stop').addEventListener('click', () => stop());
  /* テストの あいだの「つぎの もんだい」は、その 大問を とばして つぎの 大問へ */
  document.addEventListener('click', e => {
    if(!run || !P.next || !e.target.closest(P.next)) return;
    e.stopPropagation(); e.preventDefault();
    skip();
  }, true);
  /* ヒントを 見たか（ボタンを おした あと hintOn が true なら）*/
  const hb = q(P.hint);
  if(hb) hb.addEventListener('click', () => setTimeout(() => {
    const r = cur();
    const on = (typeof hintOn === 'boolean') ? hintOn : true;
    if(r && on && r.st === 'todo') r.hint = true;
  }, 0));

  /* ---- 土台の 2つの 関数を つつむ（土台に もう 2行 入っていれば つつまない）---- */
  const BUILTIN = /TestRun/.test(String(showHanamaru)) || /TestRun/.test(String(applyJudge));
  if(!BUILTIN){
    const _show = showHanamaru;
    showHanamaru = function(){
      if(!run) return _show.apply(this, arguments);
      /* はなまるは ふつうに 出す。同じ モードの つぎの 問題へは 行かせない（noAutoNext を 一時的に）*/
      const m = (typeof M === 'object' && M) ? M : null;
      const had = m && Object.prototype.hasOwnProperty.call(m, 'noAutoNext');
      const old = m ? m.noAutoNext : undefined;
      try{ if(m) m.noAutoNext = true; }catch(e){}
      try{ _show.apply(this, arguments); }
      finally{ try{ if(m){ if(had) m.noAutoNext = old; else delete m.noAutoNext; } }catch(e){} }
      api.onDone();
    };
    const _judge = applyJudge;
    applyJudge = function(r){
      if(run && r && !r.ok && !r.skip) api.miss();
      return _judge.apply(this, arguments);
    };
  }

  /* ---- 中身 ---- */
  function cur(){ return run ? run.rec[run.i] : null; }
  function clearMine(){ clearTimeout(myTimer); myTimer = 0; }
  function bar(){
    if(!run) return;
    const T = TESTS[run.t], it = T.items[run.i];
    $('test-no').textContent = '📝 ' + (/^\d+$/.test(it.no) ? it.no+'問め' : it.no) + '（' + (run.i+1) + '／' + T.items.length + '）';
    $('test-dots').textContent = run.rec.map((r,i) => r.st==='done' ? '●' : r.st==='skip' ? '－' : (i===run.i ? '◎' : '○')).join('');
  }
  /* set で かえる 値を、はじめに 1回だけ おぼえておく */
  function saveSets(t){
    const saved = {};
    TESTS[t].items.forEach(it => {
      const o = setOf(it), md = MODES[it.mode];
      Object.keys(o).forEach(k => {
        const key = it.mode + '\u0000' + k;
        if(!(key in saved)) saved[key] = { md:md, k:k, had:Object.prototype.hasOwnProperty.call(md,k), v:md[k] };
      });
    });
    return saved;
  }
  function restoreSets(saved){
    Object.keys(saved || {}).forEach(key => {
      const s = saved[key];
      try{ if(s.had) s.md[s.k] = s.v; else delete s.md[s.k]; }catch(e){}
    });
  }
  function go(i){
    clearMine();
    run.i = i;
    const it = TESTS[run.t].items[i];
    const o = setOf(it);
    Object.keys(o).forEach(k => { try{ MODES[it.mode][k] = o[k]; }catch(e){} });
    setMode(it.mode);
    bar();
  }
  function start(t){
    const cb = q(P.chalBtn);
    if(window.Challenge10 && Challenge10.isOn && Challenge10.isOn() && cb) cb.click();
    res.classList.remove('show');
    let back = nowMode();
    if(run){ back = run.back; restoreSets(run.saved); }
    run = { t:t, i:0, rec:TESTS[t].items.map(() => ({ miss:0, hint:false, st:'todo' })), back:back, saved:saveSets(t) };
    document.body.classList.add('testing');
    go(0);
  }
  function next(){
    if(!run) return;
    if(run.i + 1 < run.rec.length) go(run.i + 1);
    else finish();
  }
  function skip(){
    const r = cur(); if(!r) return;
    if(r.st !== 'done') r.st = 'skip';
    clearMine();
    if(typeof clearAutoNext === 'function') clearAutoNext();
    next();
  }
  function finish(){
    clearMine();
    const T = TESTS[run.t];
    let perfect = 0;
    const rows = T.items.map((it,i) => {
      const r = run.rec[i];
      let tx, c;
      if(r.st==='done' && r.miss===0){ tx = '⭕ ノーミス'; c = 'r-ok'; perfect++; }
      else if(r.st==='done'){ tx = 'まちがい '+r.miss+'回'; c = 'r-ng'; }
      else { tx = 'とばした'; c = 'r-sk'; }
      return '<tr><td class="no">'+it.no+'</td><td>'+itemName(it)+'</td><td class="'+c+'">'+tx+'</td><td>'+(r.hint ? '💡' : '')+'</td></tr>';
    }).join('');
    res.innerHTML = '<div class="tr-card">'
      + '<div class="tr-title">📝 '+T.title+'　おわり！</div>'
      + '<table>'+rows+'</table>'
      + '<div class="tr-sum">ノーミスで できた 問題　<b>'+perfect+'</b> ／ '+T.items.length+'</div>'
      + '<div class="tr-btns"><button id="test-again" type="button">もう一度</button><button id="test-close" type="button">とじる</button></div>'
      + '</div>';
    res.classList.add('show');
    $('test-again').onclick = () => start(run.t);
    $('test-close').onclick = () => stop();
    $('test-again').focus();
  }
  /* やめる／とじる：set で かえた 値を もどして、はじめの タブへ */
  function stop(){
    if(!run) return;
    const back = run.back, saved = run.saved;
    run = null;
    clearMine();
    res.classList.remove('show');
    document.body.classList.remove('testing');
    restoreSets(saved);
    setMode(back && MODES[back] ? back : TESTS[0].items[0].mode);
  }

  const api = {
    on: () => !!run,
    /* showHanamaru から：その 大問は おわり。はなまるの あと つぎの 大問へ */
    onDone(){
      if(!run || res.classList.contains('show')) return !!run;
      const r = cur(); r.st = 'done';
      bar();
      clearMine();
      const go2 = () => { if(typeof autoTimers !== 'undefined') autoTimers = []; next(); };
      if(typeof autoTimers !== 'undefined' && Array.isArray(autoTimers)) autoTimers.push(setTimeout(go2, waitMs()));
      else myTimer = setTimeout(go2, waitMs());
      return true;
    },
    /* applyJudge から：まちがい（skip で ない もの）*/
    miss(){ const r = cur(); if(r && r.st === 'todo') r.miss++; },
    /* 外から つかう とき用 */
    start: t => start(t || 0),
    stop:  () => stop(),
    record: () => run ? JSON.parse(JSON.stringify(run.rec)) : null
  };
  return api;
})();
</script>
<!-- 📝 テストの 練習 ここまで -->
</body>
